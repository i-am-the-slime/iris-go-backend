name: Generated Go

on:
  workflow_call:
    inputs:
      runtime-ref:
        description: iris-go ref to build against
        default: main
        type: string
      tests:
        description: nextest arguments selecting the tests-integration targets; empty runs them all
        default: --test go --test go_style
        type: string
      partitions:
        description: JSON array of nextest hash partitions, one fixtures job each
        default: '["1/1"]'
        type: string
      fixtures:
        description: Run the integration tests
        default: true
        type: boolean
      examples:
        description: Build and run iris-go's examples
        default: true
        type: boolean
    outputs:
      examples:
        description: The examples' summary line
        value: ${{ jobs.examples.outputs.summary }}

env:
  CARGO_TERM_COLOR: always
  IRIS_GO: ${{ github.workspace }}/iris-go-runtime
  IRIS_GO_FIXTURE_BUILD: require
  GOEXPERIMENT: simd
  GOFLAGS: -buildvcs=false

jobs:
  fixtures:
    name: Integration tests (${{ matrix.partition }})
    if: inputs.fixtures
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(inputs.partitions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout the iris-go runtime
        uses: actions/checkout@v7
        with:
          repository: i-am-the-slime/iris-go
          ref: ${{ inputs.runtime-ref }}
          path: iris-go-runtime
          persist-credentials: false

      - name: Install Node.js for backend verification
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: "false"
          prefix-key: "v1-generated-go"
          shared-key: "generated_go"
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition == fromJSON(inputs.partitions)[0] }}

      - name: Install tools
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-nextest

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false

      - name: Cache Go builds
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: v1-go-build-${{ runner.os }}-${{ hashFiles('iris-go-runtime/**/*.go') }}
          restore-keys: |
            v1-go-build-${{ runner.os }}-

      # The build artifact cache restores all of target/, which can include an incomplete copy of
      # the integration packages. The packages cache below owns that directory, so start it empty.
      - name: Clear restored integration packages
        run: rm -rf target/integration-packages

      - name: Cache integration packages
        uses: actions/cache@v6
        with:
          path: target/integration-packages
          key: integration-packages-v3-${{ runner.os }}-${{ hashFiles('tests-integration/packages.json', 'tests-integration/go-style-packages.json', 'tests-support/src/**') }}

      - name: Prepare integration packages
        run: |
          cargo run -p tests-support --locked -- prepare tests-integration/packages.json target/integration-packages
          cargo run -p tests-support --locked -- prepare tests-integration/go-style-packages.json target/integration-packages

      - name: Build Iris
        run: cargo build -p iris-cli --locked

      - name: Run the integration tests
        env:
          TESTS: ${{ inputs.tests }}
          PARTITION: ${{ matrix.partition }}
        run: >-
          cargo nextest run -p tests-integration $TESTS --locked
          --partition "hash:$PARTITION"
          --status-level=fail --final-status-level=fail --failure-output=final

  examples:
    name: iris-go examples against JavaScript
    if: inputs.examples
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      summary: ${{ steps.examples.outputs.summary }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout the iris-go runtime
        uses: actions/checkout@v7
        with:
          repository: i-am-the-slime/iris-go
          ref: ${{ inputs.runtime-ref }}
          path: iris-go-runtime
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@22
          install: false

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: v2-e2e-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests-e2e/tools/pnpm-lock.yaml') }}

      - name: Install Spago
        run: |
          pnpm --dir tests-e2e/tools install --frozen-lockfile
          echo "$GITHUB_WORKSPACE/tests-e2e/tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: "false"
          prefix-key: "v1-generated-go"
          shared-key: "generated_go"
          save-if: "false"

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false

      - name: Cache Go builds
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: v1-go-build-${{ runner.os }}-${{ hashFiles('iris-go-runtime/**/*.go') }}
          restore-keys: |
            v1-go-build-${{ runner.os }}-

      - name: Cache Spago registry
        uses: actions/cache@v6
        with:
          path: ~/.cache/spago-nodejs
          key: v1-generated-go-spago-${{ hashFiles('iris-go-runtime/examples/*/spago.lock') }}
          restore-keys: |
            v1-generated-go-spago-

      - name: Build Iris
        run: cargo build -p iris-cli --locked

      # Spago fetches that run at the same time into a cold registry cache fail at random, so the
      # examples' packages are fetched one project at a time before they build in parallel. Iris
      # runs Spago with its own purs; a JavaScript build that fails afterwards does not matter here.
      - name: Fetch the examples' packages
        run: |
          for manifest in iris-go-runtime/examples/*/spago.yaml; do
            (cd "$(dirname "$manifest")" && "$GITHUB_WORKSPACE/target/debug/googoo" build --js --quiet >/dev/null 2>&1) || true
          done

      - name: Build and run iris-go's examples
        id: examples
        env:
          IRIS: ${{ github.workspace }}/target/debug/googoo
          EXAMPLES: ${{ github.workspace }}/iris-go-runtime/examples
          GO_SUPPORT: ${{ github.workspace }}/iris-go-runtime
          JOBS: "4"
        run: |
          set +e
          compiler-backend/go/scripts/run-examples.sh | tee examples.log
          status=${PIPESTATUS[0]}
          set -e
          echo "summary=$(grep -m1 '^passed ' examples.log | sed 's/ (generated Go in .*//')" >> "$GITHUB_OUTPUT"
          {
            echo '## iris-go examples'
            echo
            echo '```'
            grep -v -E ' (PASS) ' examples.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
